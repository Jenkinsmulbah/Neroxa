    <section class="form-panel narrow"><p class="eyebrow">NEW DESIGN</p><h1>Set up your canvas</h1><form action="editor.html" method="get"><label for="design-name">Design name</label><input id="design-name" name="design_name" type="text" placeholder="Untitled design" required><label for="canvas-size">Canvas preset</label><select id="canvas-size" name="canvas_size"><option value="custom">Custom dimensions</option><option value="square">Square · 1080 × 1080</option><option value="portrait">Portrait · 1080 × 1350</option><option value="story">Story · 1080 × 1920</option><option value="landscape">Landscape · 1920 × 1080</option><option value="a4">A4 · Print</option></select><div class="form-grid"><div><label for="width">Width (px)</label><input id="width" name="width" type="number" min="1" value="1080"></div><div><label for="height">Height (px)</label><input id="height" name="height" type="number" min="1" value="1080"></div></div><button class="button button-primary" type="submit">Continue to editor</button></form></section>
